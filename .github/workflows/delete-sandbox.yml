name: Delete Fabric sandbox (preserve Git)
on:
  workflow_dispatch:
    inputs:
      sandbox_key: {description: "Sandbox key", required: true, type: string}
      expected_display_name: {description: "Exact Fabric workspace display name", required: true, type: string}
permissions: {contents: write, id-token: write}
concurrency:
  group: fabric-sandbox-${{ inputs.sandbox_key }}
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-latest
    environment: fabric-sandbox-delete
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r scripts/requirements.txt
      - name: Validate registry
        env: {SLUG: "${{ inputs.sandbox_key }}", EXPECTED: "${{ inputs.expected_display_name }}"}
        run: |
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{2,39}$ ]] || exit 1
          test -f "registry/sandboxes/$SLUG.json"
          python - <<'PY'
          import json, os
          r=json.load(open(f"registry/sandboxes/{os.environ['SLUG']}.json"))
          assert r['lifecycle']=='sandbox' and r['status']=='active'
          assert r['display_name']==os.environ['EXPECTED']
          open('/tmp/workspace-id','w').write(r['workspace_id'])
          PY
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete only the registered workspace
        env: {SLUG: "${{ inputs.sandbox_key }}", EXPECTED: "${{ inputs.expected_display_name }}"}
        run: |
          token=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$token"; export FABRIC_TOKEN="$token"
          id=$(cat /tmp/workspace-id)
          python scripts/fabric_workspace.py delete --registry "registry/sandboxes/$SLUG.json" --workspace-id "$id" --expected-display-name "$EXPECTED" --output /tmp/delete-result.json
          python scripts/registry.py deleted --registry "registry/sandboxes/$SLUG.json"
          git config user.name fabric-platform-bot
          git config user.email fabric-platform-bot@users.noreply.github.com
          git add "registry/sandboxes/$SLUG.json"
          git commit -m "chore(fabric): mark sandbox $SLUG deleted"
          git pull --rebase
          git push
